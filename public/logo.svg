        <path d="M 620,480 L 800,480 M 680,540 L 800,540 M 740,420 L 740,600 M 680,480 L 680,600" />
    </g>

    <path d="M 760,550 Q 770,550 770,540 Q 770,550 780,550 Q 770,550 770,560 Q 770,550 760,550 Z" fill="#4c779e" opacity="0.4" />

    <g filter="url(#neonGlow)" stroke="url(#neonGradient)" fill="none" stroke-linecap="round" stroke-linejoin="round">
