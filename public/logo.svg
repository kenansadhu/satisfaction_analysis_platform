    <text x="400" y="445" font-family="'Montserrat', 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="44" text-anchor="middle" letter-spacing="0.5">
        <tspan fill="#ffffff" font-weight="400">satisfaction</tspan>
        <tspan fill="#00e1ff" font-weight="600">voice</tspan>
    </text>

    <g id="bottom-ui">
        <path d="M 470, 520 L 530, 520 A 10 10 0 0 0 540, 510 L 540, 460" fill="none" stroke="#4c779e" stroke-width="1.5" stroke-linejoin="round" />
        <circle cx="540" cy="457" r="3" fill="#07111f" stroke="#00e1ff" stroke-width="1.5" filter="url(#dotGlow)" />
