<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
    <defs>
        <radialGradient id="bgGradient" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#112949" />
            <stop offset="100%" stop-color="#07111f" />
        </radialGradient>
        <linearGradient id="neonGradient" x1="250" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1a6ee8" />
            <stop offset="35%" stop-color="#2196f3" />
            <stop offset="70%" stop-color="#00e1ff" />
            <stop offset="100%" stop-color="#ccffff" />
        </linearGradient>
        <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur3" />
            <feMerge>
                <feMergeNode in="blur3" />
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <rect width="100%" height="100%" fill="url(#bgGradient)" />

    <g stroke="#ffffff" stroke-width="1.5" opacity="0.03">
